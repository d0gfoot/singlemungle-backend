services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ${POSTGRES_CONTAINER_NAME:-singlemungle-postgres}
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-singlemungle}
      POSTGRES_USER: ${DB_USERNAME:-singlemungle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-singlemungle}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=${DB_LOCALE:-en_US.utf8}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-singlemungle-postgres-data}
