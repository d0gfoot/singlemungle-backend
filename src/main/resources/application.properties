spring.application.name=singlemungle-backend
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

app.api.token=${API_TOKEN:}

app.jwt.secret=${JWT_SECRET:singlemungle-local-development-secret-key-change-me}
app.jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
app.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:singlemungle}}
spring.datasource.username=${DB_USERNAME:singlemungle}
spring.datasource.password=${DB_PASSWORD:singlemungle}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.singlemungle.backend=${LOG_LEVEL_APP:DEBUG}
logging.file.name=${LOG_FILE_NAME:logs/singlemungle.log}
app.logging.request.enabled=${REQUEST_LOGGING_ENABLED:true}
