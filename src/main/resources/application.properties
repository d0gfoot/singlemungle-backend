spring.application.name=singlemungle-backend
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

app.api.token=${API_TOKEN:}

app.jwt.secret=${JWT_SECRET:singlemungle-local-development-secret-key-change-me}
app.jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
app.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

app.vertex-ai.enabled=${VERTEX_AI_ENABLED:false}
app.vertex-ai.project-id=${VERTEX_AI_PROJECT_ID:}
app.vertex-ai.location=${VERTEX_AI_LOCATION:us-central1}
app.vertex-ai.image-model=${VERTEX_AI_IMAGE_MODEL:gemini-3.1-flash-lite-image}
app.vertex-ai.timeout-seconds=${VERTEX_AI_TIMEOUT_SECONDS:30}

app.google-places.enabled=${GOOGLE_PLACES_ENABLED:false}
app.google-places.api-key=${GOOGLE_PLACES_API_KEY:}
app.google-places.language-code=${GOOGLE_PLACES_LANGUAGE_CODE:ko}
app.google-places.region-code=${GOOGLE_PLACES_REGION_CODE:KR}
app.google-places.timeout-seconds=${GOOGLE_PLACES_TIMEOUT_SECONDS:5}
app.google-places.center-latitude=${GOOGLE_PLACES_CENTER_LATITUDE:37.5000530744517}
app.google-places.center-longitude=${GOOGLE_PLACES_CENTER_LONGITUDE:126.86799268384159}
app.google-places.default-radius-meters=${GOOGLE_PLACES_DEFAULT_RADIUS_METERS:10000}
app.google-places.max-radius-meters=${GOOGLE_PLACES_MAX_RADIUS_METERS:10000}
app.google-places.max-results=${GOOGLE_PLACES_MAX_RESULTS:20}
app.google-places.beauty-search-query=${GOOGLE_PLACES_BEAUTY_SEARCH_QUERY:dog grooming}

app.image-storage.directory=${IMAGE_STORAGE_DIRECTORY:build/generated-images}
app.image-storage.temp-directory=${IMAGE_STORAGE_TEMP_DIRECTORY:build/temp-images}
app.image-storage.base-url=${IMAGE_STORAGE_BASE_URL:/api/v1/beauty/style-simulations/images}
app.image-storage.cleanup.enabled=${IMAGE_STORAGE_CLEANUP_ENABLED:true}
app.image-storage.cleanup.cron=${IMAGE_STORAGE_CLEANUP_CRON:0 0 4 * * *}
app.image-storage.cleanup.pending-cron=${IMAGE_STORAGE_PENDING_CLEANUP_CRON:0 * * * * *}
app.image-storage.cleanup.pending-timeout-minutes=${IMAGE_STORAGE_PENDING_TIMEOUT_MINUTES:10}
app.image-storage.cleanup.temp-cron=${IMAGE_STORAGE_TEMP_CLEANUP_CRON:0 30 * * * *}
app.image-storage.cleanup.temp-retention-hours=${IMAGE_STORAGE_TEMP_RETENTION_HOURS:24}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:singlemungle}}
spring.datasource.username=${DB_USERNAME:singlemungle}
spring.datasource.password=${DB_PASSWORD:singlemungle}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.singlemungle.backend=${LOG_LEVEL_APP:DEBUG}
logging.file.name=${LOG_FILE_NAME:logs/singlemungle.log}
app.logging.request.enabled=${REQUEST_LOGGING_ENABLED:true}
