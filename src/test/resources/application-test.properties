spring.datasource.url=jdbc:h2:mem:singlemungle-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.test.database.replace=none
app.vertex-ai.enabled=false
app.google-places.enabled=false
app.image-storage.directory=build/test-generated-images
app.image-storage.temp-directory=build/test-temp-images
app.image-storage.cleanup.enabled=false
